name: Mobile CI

on:
  push:
    branches: [main]
    paths: ['tasa-del-dia/**']
  pull_request:
    branches: [main]
    paths: ['tasa-del-dia/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasa-del-dia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: tasa-del-dia/package-lock.json
      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: tasa-del-dia/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('tasa-del-dia/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Lint
        run: npx expo lint
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true
      - run: npm test -- --ci --coverage
        env:
          CI: true
