name: Build APK (React Native)

on:
  push:
    branches: [main, master]
    paths:
      - 'tasa-del-dia/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificar código React Native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasa-del-dia

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar que existe app React Native
        run: |
          if [ ! -f "package.json" ]; then
            echo "⚠️  El directorio tasa-del-dia/ está vacío."
            echo ""
            echo "La app React Native no está incluida en este repositorio."
            echo "Para compilar el APK necesitas:"
            echo "  1. Tener el proyecto React Native en tasa-del-dia/"
            echo "  2. Configurar EXPO_TOKEN como secreto de GitHub"
            echo ""
            echo "Build cancelado — no hay código fuente para compilar."
            exit 1
          fi
          echo "✅ package.json encontrado"

      - name: Setup Node.js
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tasa-del-dia/package-lock.json

      - name: Instalar dependencias
        if: success()
        run: npm ci

      - name: Instalar EAS CLI
        if: success()
        run: npm install -g eas-cli

      - name: Autenticar en Expo
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️  EXPO_TOKEN no configurado"
            echo "Crea un token en: https://expo.dev/accounts/jr8812/settings/access-tokens"
            echo "Luego agrégalo como secreto en GitHub: EXPO_TOKEN"
            exit 1
          fi
          npx eas whoami --non-interactive

      - name: Compilar APK con EAS Build
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 45
        run: |
          npx eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: Descargar APK
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build:download \
            --platform android \
            --output TasaDelDia.apk \
            --non-interactive || true
          if [ -f "TasaDelDia.apk" ]; then
            echo "✅ APK descargada: $(ls -lh TasaDelDia.apk | awk '{print $5}')"
          fi

      - name: Subir APK como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TasaDelDia.apk
          path: tasa-del-dia/TasaDelDia.apk
          retention-days: 30
          if-no-files-found: warn