name: Build APK (React Native)

on:
  push:
    branches: [main, master]
    paths:
      - 'tasa-del-dia/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasa-del-dia

    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar que existe app React Native
        run: |
          if [ ! -f "package.json" ]; then
            echo "⚠️  El directorio tasa-del-dia/ está vacío."
            exit 0
          fi
          echo "✅ package.json encontrado"
          
          if [ ! -f "app.config.js" ]; then
            echo "❌ app.config.js no encontrado en tasa-del-dia/"
            exit 1
          fi
          echo "✅ app.config.js encontrado"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'tasa-del-dia/package-lock.json'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Ejecutar Tests
        run: npm test
        continue-on-error: true

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Autenticar en Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️  EXPO_TOKEN no configurado"
            echo "Crea un token en: https://expo.dev/accounts/jr8812/settings/access-tokens"
            echo "Luego agrégalo como secreto en GitHub: EXPO_TOKEN"
            exit 1
          fi
          npx eas whoami --non-interactive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tasa-del-dia/android/**/*.gradle*', 'tasa-del-dia/android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generar proyecto nativo (prebuild)
        run: npx expo prebuild --clean --non-interactive

      - name: Compilar APK localmente (GitHub Runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 60
        run: |
          npx eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output TasaDelDia.apk

      - name: Verificar APK generada
        run: |
          if [ -f "TasaDelDia.apk" ]; then
            echo "✅ APK generada: $(ls -lh TasaDelDia.apk | awk '{print $5}')"
          else
            echo "❌ No se encontró TasaDelDia.apk"
            exit 1
          fi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: TasaDelDia.apk
          path: tasa-del-dia/TasaDelDia.apk
          retention-days: 30
          if-no-files-found: error
