name: Build APK (React Native)

on:
  push:
    branches: [main, master]
    paths:
      - 'tasa-del-dia/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasa-del-dia

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar que existe app React Native
        run: |
          if [ ! -f "package.json" ]; then
            echo "⚠️  El directorio tasa-del-dia/ está vacío."
            exit 0
          fi
          echo "✅ package.json encontrado"

          if [ ! -f "app.config.js" ]; then
            echo "❌ app.config.js no encontrado en tasa-del-dia/"
            exit 1
          fi
          echo "✅ app.config.js encontrado"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'tasa-del-dia/package-lock.json'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: tasa-del-dia/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('tasa-del-dia/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Autenticar en Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️  EXPO_TOKEN no configurado"
            echo "Crea un token en: https://expo.dev/accounts/jr8812/settings/access-tokens"
            echo "Luego agrégalo como secreto en GitHub: EXPO_TOKEN"
            exit 1
          fi
          npx eas whoami --non-interactive

      - name: Instalar Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          build-tools: 35.0.0
          android-sdk-level: 35

      - name: Verificar variables de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PATH=$PATH"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin" 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version 2>/dev/null || true

      - name: Compilar APK localmente (GitHub Runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 60
        run: |
          npx eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output TasaDelDia.apk

      - name: Verificar APK generada
        run: |
          if [ -f "TasaDelDia.apk" ]; then
            echo "✅ APK generada: $(ls -lh TasaDelDia.apk | awk '{print $5}')"
          else
            echo "❌ No se encontró TasaDelDia.apk"
            exit 1
          fi

      - name: Verificar firma APK (signing key check)
        run: |
          # SHA-256 del keystore EAS que firma todas las release builds.
          # Si cambia, la app no podrá actualizarse por encima de versiones
          # anteriores (Android requiere la misma firma para upgrades).
          EXPECTED_SHA256="299073e3f85f9fc471298bc9d3e61f3c207a5dd0b406ec1d1ffc3ede37e528eb"
          ACTUAL_SHA256=$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
              TasaDelDia.apk 2>&1 \
            | grep "SHA-256 digest" | awk '{print $NF}'
          )
          echo "🔐 Firma APK:      $ACTUAL_SHA256"
          echo "🔑 Firma esperada:  $EXPECTED_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ Firma mismatch — la APK NO podrá actualizarse sobre versiones anteriores"
            echo "💡 Verifica que EXPO_TOKEN esté configurado y eas build --local lo use"
            exit 1
          fi
          echo "✅ Firma correcta — upgrade compatible con versiones anteriores"

      - name: Obtener versión de la app
        id: app_version
        run: |
          VERSION=$(node -p "require('./app.config.js').expo.version" 2>/dev/null | grep -xE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Versión detectada: $VERSION"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: TasaDelDia.apk
          path: tasa-del-dia/TasaDelDia.apk
          retention-days: 30
          if-no-files-found: error

      - name: Subir APK como artefacto de Release (solo a release existente)
        if: github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.app_version.outputs.version }}"
          echo "📦 Subiendo APK al tag $TAG"

          if [ -z "${{ steps.app_version.outputs.version }}" ] || [ "$TAG" = "v" ]; then
            echo "❌ No se pudo extraer una versión válida"
            exit 1
          fi

          # NUNCA crear releases aquí: colisiona con release-automatic.yml
          # (dos workflows creando el mismo tag = uno falla). Solo se sube la
          # APK si la release ya existe (la crea release-automatic.yml).
          if gh release view "$TAG" --json tagName --jq .tagName >/dev/null 2>&1; then
            gh release upload "$TAG" TasaDelDia.apk --clobber
            echo "✅ APK subida a la release existente $TAG"
          else
            echo "🟡 Release $TAG no existe aún — APK queda solo como artefacto"
            echo "ℹ️  La release la crea release-automatic.yml (workflow_dispatch o tag v*)"
          fi