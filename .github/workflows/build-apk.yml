name: Build APK (React Native)

on:
  push:
    branches: [main, master]
    paths:
      - 'tasa-del-dia/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificar código React Native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasa-del-dia

    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Verificar que existe app React Native
        run: |
          ls -R
          if [ ! -f "package.json" ]; then
            echo "⚠️  El directorio tasa-del-dia/ está vacío."
            exit 0
          fi
          echo "✅ package.json encontrado"
          
          if [ ! -f "app.config.js" ]; then
            echo "❌ app.config.js no encontrado en tasa-del-dia/"
            exit 1
          fi
          echo "✅ app.config.js encontrado"

      - name: Setup Node.js
        if: success()
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'tasa-del-dia/package-lock.json'

      - name: Instalar dependencias
        if: success()
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            echo "⚠️  No se encontró package-lock.json, usando npm install"
            npm install
          fi

      - name: Ejecutar Tests
        if: success()
        run: npm test

      - name: Instalar EAS CLI
        if: success()
        run: npm install -g eas-cli

      - name: Autenticar en Expo
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️  EXPO_TOKEN no configurado"
            echo "Crea un token en: https://expo.dev/accounts/jr8812/settings/access-tokens"
            echo "Luego agrégalo como secreto en GitHub: EXPO_TOKEN"
            exit 1
          fi
          npx eas whoami --non-interactive

      - name: Compilar APK con EAS Build
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 45
        run: |
          npx eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: Descargar APK
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build:download \
            --platform android \
            --output TasaDelDia.apk \
            --non-interactive || true
          if [ -f "TasaDelDia.apk" ]; then
            echo "✅ APK descargada: $(ls -lh TasaDelDia.apk | awk '{print $5}')"
          fi

      - name: Subir APK como artefacto
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TasaDelDia.apk
          path: tasa-del-dia/TasaDelDia.apk
          retention-days: 30
          if-no-files-found: warn
