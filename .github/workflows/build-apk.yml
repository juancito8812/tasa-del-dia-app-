name: Build APK (React Native)

on:
  push:
    branches: [main, master]
    paths:
      - 'tasa-del-dia/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasa-del-dia

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar que existe app React Native
        run: |
          if [ ! -f "package.json" ]; then
            echo "⚠️  El directorio tasa-del-dia/ está vacío."
            exit 0
          fi
          echo "✅ package.json encontrado"

          if [ ! -f "app.config.js" ]; then
            echo "❌ app.config.js no encontrado en tasa-del-dia/"
            exit 1
          fi
          echo "✅ app.config.js encontrado"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'tasa-del-dia/package-lock.json'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: tasa-del-dia/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('tasa-del-dia/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Autenticar en Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️  EXPO_TOKEN no configurado"
            echo "Crea un token en: https://expo.dev/accounts/jr8812/settings/access-tokens"
            echo "Luego agrégalo como secreto en GitHub: EXPO_TOKEN"
            exit 1
          fi
          npx eas whoami --non-interactive

      - name: Instalar Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          build-tools: 35.0.0
          android-sdk-level: 35

      - name: Verificar variables de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PATH=$PATH"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin" 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version 2>/dev/null || true

      - name: Compilar APK localmente (GitHub Runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 60
        run: |
          npx eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output TasaDelDia.apk

      - name: Verificar APK generada
        run: |
          if [ -f "TasaDelDia.apk" ]; then
            echo "✅ APK generada: $(ls -lh TasaDelDia.apk | awk '{print $5}')"
          else
            echo "❌ No se encontró TasaDelDia.apk"
            exit 1
          fi

      - name: Obtener versión de la app
        id: app_version
        run: |
          VERSION=$(node -p "require('./app.config.js').expo.version" 2>/dev/null | grep -xE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Versión detectada: $VERSION"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: TasaDelDia.apk
          path: tasa-del-dia/TasaDelDia.apk
          retention-days: 30
          if-no-files-found: error

      - name: Crear Release en GitHub con tag semver
        if: github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.app_version.outputs.version }}"
          echo "📦 Versión: $VERSION"

          # Validar que la versión no esté vacía
          if [ -z "${{ steps.app_version.outputs.version }}" ] || [ "$VERSION" = "v" ]; then
            echo "❌ No se pudo extraer una versión válida"
            exit 1
          fi

          # Eliminar release previo con este tag si existe
          gh release delete "$VERSION" --yes 2>/dev/null || echo "No existing release $VERSION to delete"

          # Crear nuevo release con tag = versión semver
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Build automático del ${{ github.ref_name }} — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --latest

          # Subir APK al release
          gh release upload "$VERSION" TasaDelDia.apk --clobber
          echo "✅ APK subida a GitHub Release $VERSION"
          echo "📎 Descarga: https://github.com/${{ github.repository }}/releases/download/$VERSION/TasaDelDia.apk"
