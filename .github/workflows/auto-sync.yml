name: 🤖 Auto-Sync (daily commit)

on:
  schedule:
    # Todos los días a las 6:00 AM UTC (2:00 AM Venezuela)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      message:
        description: 'Mensaje de commit personalizado (opcional)'
        type: string
        required: false

permissions:
  contents: write

jobs:
  sync:
    name: Sincronizar cambios automáticos
    runs-on: ubuntu-latest
    # Guard de rama: si alguien dispara workflow_dispatch sobre otra rama
    # (ej. feature/ui-2026), el job se salta entero y no commitea nada.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v6
        with:
          # Rama fijada: este workflow SOLO opera sobre main. Sin esto, un
          # workflow_dispatch permitiría elegir otra rama y el auto-sync
          # commitearía ahí (historial contaminado con "chore" diarios).
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config user.name "git-sync-assistant[bot]"
          git config user.email "git-sync-assistant[bot]@users.noreply.github.com"

      - name: Verificar cambios
        id: status
        run: |
          # -uno: ignora archivos untracked — este workflow solo commitea
          # archivos YA trackeados (nunca archivos nuevos/ignorados).
          STATUS=$(git status --porcelain -uno)
          echo "status<<EOF" >> $GITHUB_OUTPUT
          echo "$STATUS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ -z "$STATUS" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "🟢 No hay cambios pendientes"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "🟡 Cambios detectados:"
            echo "$STATUS"
          fi

      - name: Generar mensaje de commit
        id: commit-message
        if: steps.status.outputs.has_changes == 'true'
        run: |
          if [ -n "${{ inputs.message }}" ]; then
            echo "message=${{ inputs.message }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          ADDED=$(git status --porcelain | grep -c '^[A?]' || echo 0)
          DELETED=$(git status --porcelain | grep -c '^ D' || echo 0)
          MODIFIED=$(git status --porcelain | grep -c '^.M' || echo 0)
          CHANGED_FILES=$(git status --porcelain | awk '{print $2}' | head -3 | tr '\n' ', ' | sed 's/, $//')
          FILE_COUNT=$(git status --porcelain | wc -l)

          if [ "$FILE_COUNT" -le 3 ]; then
            DESC="Actualizar ${CHANGED_FILES}"
          else
            DESC="Actualizar ${FILE_COUNT} archivo(s)"
          fi

          MSG="🔧 chore: ${DESC}"
          echo "message=${MSG}" >> $GITHUB_OUTPUT
          echo "📝 Mensaje generado: $MSG"

      - name: Hacer commit y push
        if: steps.status.outputs.has_changes == 'true'
        run: |
          # git add restringido: solo archivos trackeados (-u) y con exclusiones
          # explícitas de patrones sensibles (belt-and-suspenders sobre .gitignore).
          # NUNCA se agregan archivos untracked (vector de fuga de secretos/generados).
          git add -u -- . \
            ':(exclude)*.env' ':(exclude)*.env.*' \
            ':(exclude)*.jks' ':(exclude)*.p12' ':(exclude)*.p8' \
            ':(exclude)*.key' ':(exclude)*.mobileprovision' \
            ':(exclude)*.apk' ':(exclude)*.aab' ':(exclude)*.keystore'
          if git diff --cached --quiet; then
            echo "🟢 No hay cambios relevantes después del add, saltando commit"
            exit 0
          fi
          git commit -m "${{ steps.commit-message.outputs.message }}"
          # Si main avanzó en el remoto entre el checkout y el push, rebase
          # antes de pushear (nunca --force): fallo seguro, sin sobrescribir.
          git pull --rebase origin main
          git push
          echo "✅ Commit y push realizados"

      - name: Resumen final
        run: |
          if [ "${{ steps.status.outputs.has_changes }}" = "true" ]; then
            echo "✅ Sincronización completada"
          else
            echo "🟢 No se detectaron cambios para sincronizar."
          fi