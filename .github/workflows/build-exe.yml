name: Build .EXE (Desktop)

on:
  push:
    branches: [main, master]
    paths:
      - 'tasa-del-dia-desktop/**'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Build rápido (sin regenerar icono)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar TasaDelDia.exe
    runs-on: windows-latest

    defaults:
      run:
        working-directory: tasa-del-dia-desktop

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tasa-del-dia-desktop/requirements.txt

      - name: Instalar PyInstaller y dependencias
        run: |
          pip install -r requirements.txt
          echo "PyInstaller $(python -m PyInstaller --version)"

      - name: Generar icono
        if: ${{ !inputs.quick }}
        run: python generate_icon.py

      - name: Compilar .EXE con PyInstaller
        run: python -m PyInstaller --clean TasaDelDia.spec
        timeout-minutes: 10

      - name: Verificar .EXE
        run: |
          if (Test-Path "dist/TasaDelDia.exe") {
            $size = (Get-Item "dist/TasaDelDia.exe").Length
            $sizeMB = [math]::Round($size / 1MB, 1)
            Write-Host "✅ EXE creado: $sizeMB MB"
          } else {
            Write-Error "❌ No se encontró dist/TasaDelDia.exe"
            exit 1
          }

      - name: Subir .EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TasaDelDia.exe
          path: tasa-del-dia-desktop/dist/TasaDelDia.exe
          retention-days: 30
          if-no-files-found: error