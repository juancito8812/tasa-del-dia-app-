name: Release Automático con Changelog

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a liberar (ej: 1.1.0). Si está vacío, se usa la versión de app.config.js'
        required: false
        type: string
      bump_type:
        description: 'Tipo de bump si no se especifica versión'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  release:
    name: Release v${{ github.event.inputs.version || github.ref_name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasa-del-dia

    steps:
      - name: Checkout código con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'tasa-del-dia/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: tasa-del-dia/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('tasa-del-dia/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - if: steps.cache-node-modules.outputs.cache-hit != 'true'
        name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Ejecutar Tests
        run: npm test

      - name: Determinar versión del release
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            CURRENT=$(node -p "require('./app.config.js').expo.version" 2>/dev/null | grep -xE '[0-9]+\.[0-9]+\.[0-9]+')
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ github.event.inputs.bump_type }}" in
              major) VERSION="$((MAJOR+1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR+1)).0" ;;
              *)     VERSION="$MAJOR.$MINOR.$((PATCH+1))" ;;
            esac
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versión: $VERSION"

      - name: Generar changelog
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHANGELOG=$(node scripts/generate-changelog.js)
          DELIM="_CHANGELOG_DONE_"
          echo "changelog<<$DELIM" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT
          echo "📝 Changelog generado:"
          echo "$CHANGELOG"

      - name: Actualizar versión en app.config.js
        run: |
          # Si el trigger fue un tag (detached HEAD), posicionarse en main
          # para que el commit del bump llegue a la rama y no falle el push.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            git fetch origin main
            git checkout -b ci-release origin/main
          fi
          # El bump actualiza la const VERSION de app.config.js; el versionCode
          # Android se deriva automáticamente de la versión (mayor*10000+menor*100+patch).
          sed -i "s/const VERSION = '[0-9.]*'/const VERSION = '${{ steps.version.outputs.version }}'/" app.config.js
          echo "✅ app.config.js actualizado a ${{ steps.version.outputs.version }}"

      - name: Commit version bump a main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "release-bot[bot]"
          git config user.email "release-bot[bot]@users.noreply.github.com"
          git add app.config.js
          if git diff --cached --quiet; then
            echo "🟢 Sin cambios en app.config.js"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:main
            echo "✅ Version bump committeada a main"
          fi

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Autenticar en Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️  EXPO_TOKEN no configurado"
            echo "Crea un token en: https://expo.dev/accounts/jr8812/settings/access-tokens"
            echo "Luego agrégalo como secreto en GitHub: EXPO_TOKEN"
            exit 1
          fi
          npx eas whoami --non-interactive

      - name: Instalar Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          build-tools: 35.0.0
          android-sdk-level: 35

      - name: Compilar APK localmente
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 60
        run: |
          APK_NAME="TasaDelDia-${{ steps.version.outputs.tag }}.apk"
          npx eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "$APK_NAME"

      - name: Verificar APK generada
        run: |
          APK_NAME="TasaDelDia-${{ steps.version.outputs.tag }}.apk"
          if [ -f "$APK_NAME" ]; then
            echo "✅ APK: $(ls -lh "$APK_NAME" | awk '{print $5}')"
          else
            echo "❌ APK no encontrada: $APK_NAME"
            exit 1
          fi

      - name: Verificar firma APK (signing key check)
        run: |
          APK_NAME="TasaDelDia-${{ steps.version.outputs.tag }}.apk"
          EXPECTED_SHA256="299073e3f85f9fc471298bc9d3e61f3c207a5dd0b406ec1d1ffc3ede37e528eb"
          ACTUAL_SHA256=$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
              "$APK_NAME" 2>&1 \
            | grep "SHA-256 digest" | awk '{print $NF}'
          )
          echo "🔐 Firma APK:      $ACTUAL_SHA256"
          echo "🔑 Firma esperada:  $EXPECTED_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ Firma mismatch — la APK NO podrá actualizarse sobre versiones anteriores"
            echo "💡 Verifica que EXPO_TOKEN esté configurado y eas build --local lo use"
            exit 1
          fi
          echo "✅ Firma correcta — upgrade compatible con versiones anteriores"

      - name: Crear/Actualizar GitHub Release (upsert)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          APK_NAME="TasaDelDia-${{ steps.version.outputs.tag }}.apk"

          # Upsert: si la release ya existe (la creó build-apk o un reintento),
          # se actualiza en vez de fallar con "release already exists".
          if gh release view "$TAG" --json tagName --jq .tagName >/dev/null 2>&1; then
            echo "🟡 Release $TAG ya existe — actualizando notas y APK"
            gh release edit "$TAG" \
              --title "v$VERSION" \
              --notes "${{ steps.changelog.outputs.changelog }}"
          else
            echo "✅ Creando release $TAG"
            gh release create "$TAG" \
              --title "v$VERSION" \
              --notes "${{ steps.changelog.outputs.changelog }}" \
              --latest
          fi

          # Subir/actualizar APK del release versionado
          gh release upload "$TAG" "$APK_NAME" --clobber

          echo "✅ Release v$VERSION lista"
          echo "📎 https://github.com/${{ github.repository }}/releases/tag/$TAG"