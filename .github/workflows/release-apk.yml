name: Release APK (React Native)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK (Release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasa-del-dia

    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Verificar que existe app React Native
        run: |
          if [ ! -f "package.json" ]; then
            echo "⚠️  El directorio tasa-del-dia/ está vacío."
            echo ""
            echo "La app React Native no está incluida en este repositorio."
            echo "Agrega el proyecto React Native en tasa-del-dia/ para usar este workflow."
            exit 1
          fi
          echo "✅ package.json encontrado"

      - name: Setup Node.js
        if: success()
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'tasa-del-dia/package-lock.json'

      - name: Instalar dependencias
        if: success()
        run: npm install --legacy-peer-deps

      - name: Ejecutar Tests
        if: success()
        run: npm test

      - name: Instalar EAS CLI
        if: success()
        run: npm install -g eas-cli

      - name: Obtener versión del tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $TAG"

      - name: Autenticar en Expo
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "⚠️  EXPO_TOKEN no configurado"
            exit 1
          fi
          npx eas whoami --non-interactive

      - name: Compilar APK con EAS Build
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 45
        run: |
          npx eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: Descargar APK
        if: success()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build:download \
            --platform android \
            --output TasaDelDia-${{ steps.version.outputs.tag }}.apk \
            --non-interactive || true
          if [ -f "TasaDelDia-${{ steps.version.outputs.tag }}.apk" ]; then
            echo "✅ APK descargada"
          fi

      - name: Subir APK como artefacto del release
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: TasaDelDia-${{ steps.version.outputs.tag }}.apk
          path: tasa-del-dia/TasaDelDia-${{ steps.version.outputs.tag }}.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Subir APK al Release de GitHub
        if: github.event_name == 'release' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "TasaDelDia-${{ steps.version.outputs.tag }}.apk" ]; then
            gh release upload ${{ steps.version.outputs.tag }} TasaDelDia-${{ steps.version.outputs.tag }}.apk --clobber
            echo "✅ APK adjuntada al release"
          fi